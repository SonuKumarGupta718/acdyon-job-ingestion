spring.application.name=job-ingestion
server.port=8081

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/job_ingestion}
spring.mongodb.database=${MONGODB_DATABASE:job_ingestion}

# Job Ingestion Settings
job.ingestion.source-url=${JOB_INGESTION_SOURCE_URL:https://www.arbeitnow.com/api/job-board-api}
job.ingestion.scheduler.cron=${JOB_INGESTION_SCHEDULER_CRON:0 0/30 * * * ?}
job.ingestion.scheduler.enabled=${JOB_INGESTION_SCHEDULER_ENABLED:true}
job.ingestion.connect-timeout-ms=${JOB_INGESTION_CONNECT_TIMEOUT:5000}
job.ingestion.read-timeout-ms=${JOB_INGESTION_READ_TIMEOUT:10000}
job.ingestion.max-retries=${JOB_INGESTION_MAX_RETRIES:3}
job.ingestion.backoff-delay-ms=${JOB_INGESTION_BACKOFF_DELAY:2000}
